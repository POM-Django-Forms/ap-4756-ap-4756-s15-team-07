<!DOCTYPE html>
<html>
<head>
    <title>My Orders</title>

    <style>
        .navigation {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .navigation form {
            margin: 0;
        }
    </style>
</head>

<body>

<div class="navigation">
    <a href="{% url 'book_list' %}">
        <button type="button">Books</button>
    </a>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
</div>

<h1>My Orders</h1>

{% for order in orders %}
    <div>
        <p>Order ID: {{ order.id }}</p>

        <p>
            Book:
            <a href="{% url 'book_detail' order.book.id %}">
                {{ order.book.name }}
            </a>
        </p>

        <p>Created: {{ order.created_at }}</p>
        <p>Planned end: {{ order.plated_end_at }}</p>
        <p>Returned: {{ order.end_at }}</p>
    </div>

    <hr>

{% empty %}
    <p>You have no orders.</p>
{% endfor %}

</body>
</html>
